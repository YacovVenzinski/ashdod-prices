name: build-prices

on:
  schedule:
    - cron: "17 1 * * *"   # every night, ~03:17 Israel time
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["collect/**", ".github/workflows/build.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect Ashdod prices
        run: python collect/collect.py site
      - name: Landing page
        run: echo "<!doctype html><meta charset=utf-8><title>ashdod-prices</title><p>Ashdod supermarket prices API. See meta.json" > site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v4
