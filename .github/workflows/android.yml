name: build-android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Restore (or create) the app signing key
        uses: actions/cache@v4
        id: key
        with:
          path: android/app/keystore.jks
          key: android-signing-key-v1
      - name: Create signing key on first run
        if: steps.key.outputs.cache-hit != 'true'
        run: >
          keytool -genkeypair -keystore android/app/keystore.jks -storepass pricecompare -keypass pricecompare
          -alias main -keyalg RSA -keysize 2048 -validity 36500 -dname "CN=PriceCompare, O=Yaakov"
      - name: Build release APK
        working-directory: android
        run: gradle --no-daemon assembleRelease
      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk Compare-v8.apk
          gh release delete app-latest --yes --cleanup-tag 2>/dev/null || true
          gh release create app-latest Compare-v8.apk --title "Compare v8" --notes "Latest Android build (run ${{ github.run_number }}, commit ${{ github.sha }})"
